<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>DndHotkey app icon</title>
  <desc>A keyboard hotkey with a crescent moon for Windows Do Not Disturb.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#253b67"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="key" x1="58" y1="58" x2="162" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8f4"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#background)"/>
  <rect x="24" y="24" width="208" height="208" rx="44" fill="none" stroke="#87f5e5" stroke-opacity=".55" stroke-width="8"/>
  <rect x="44" y="52" width="124" height="92" rx="22" fill="url(#key)" stroke="#9fb6ca" stroke-width="6"/>
  <text x="106" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#1a2b49">D</text>
  <path
    d="M160 90a56 56 0 1 0 42.5 92.5A52 52 0 1 1 160 90Z"
    fill="#fbfdff"/>
  <circle cx="72" cy="184" r="9" fill="#87f5e5"/>
  <rect x="92" y="176" width="70" height="16" rx="8" fill="#87f5e5"/>
