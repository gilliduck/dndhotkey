name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DndHotkey.slnx

      - name: Verify formatting
        run: dotnet format DndHotkey.slnx --verify-no-changes --no-restore

      - name: Build app
        run: dotnet build src\DndHotkey.App\DndHotkey.App.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests\DndHotkey.Core.Tests\DndHotkey.Core.Tests.csproj -c Release --no-restore --logger trx
